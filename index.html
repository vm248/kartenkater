<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kartenkater" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Kartenkater</title>
</head>
<body>
  <script>
    // Apply theme before first paint (must run inside <body>, document.body is null in <head>)
    (function() {
      try {
        if (localStorage.getItem('busfahren_dark') === '1') document.body.classList.add('dark');
        var theme = localStorage.getItem('busfahren_theme') || 'mono';
        if (theme !== 'lila') document.body.classList.add('theme-' + theme);
      } catch (e) { /* storage blocked */ }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
